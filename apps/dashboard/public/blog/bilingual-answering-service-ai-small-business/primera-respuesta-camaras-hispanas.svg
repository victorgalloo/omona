<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="Bar chart: of 593 US Hispanic chamber member homepages, 11.3% offer an instant text channel, 63.1% only slow channels, 25.6% no channel, 25.5% are bilingual and 3.5% are both bilingual and instant.">
<rect width="920" height="360" fill="#fafafa"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111111">
<text x="32" y="36" font-size="11" fill="#666666" letter-spacing="0.06em">FIRST RESPONSE ON 593 US HISPANIC CHAMBER MEMBER HOMEPAGES · 2026-11-26</text>
<line x1="32" y1="50" x2="888" y2="50" stroke="#e5e5e5" stroke-width="1"/>
<text x="32" y="86" font-size="12" fill="#111111" font-family="system-ui, -apple-system, sans-serif">Instant text channel (chat, SMS, WhatsApp)</text>
<rect x="440" y="72" width="400" height="18" rx="3" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<rect x="440" y="72" width="45.2" height="18" rx="3" fill="#297a3a"/>
<text x="852" y="86" font-size="12">11.3%</text>
<text x="32" y="126" font-size="12" fill="#111111" font-family="system-ui, -apple-system, sans-serif">Only slow channels (form, email, phone, booking)</text>
<rect x="440" y="112" width="400" height="18" rx="3" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<rect x="440" y="112" width="252.4" height="18" rx="3" fill="#111111"/>
<text x="852" y="126" font-size="12">63.1%</text>
<text x="48" y="166" font-size="12" fill="#666666" font-family="system-ui, -apple-system, sans-serif">of which: phone is the only fast channel</text>
<rect x="440" y="152" width="400" height="18" rx="3" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<rect x="440" y="152" width="141.6" height="18" rx="3" fill="#111111"/>
<text x="852" y="166" font-size="12">35.4%</text>
<text x="32" y="206" font-size="12" fill="#111111" font-family="system-ui, -apple-system, sans-serif">No contact channel in the homepage HTML</text>
<rect x="440" y="192" width="400" height="18" rx="3" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<rect x="440" y="192" width="102.4" height="18" rx="3" fill="#111111"/>
<text x="852" y="206" font-size="12">25.6%</text>
<text x="32" y="246" font-size="12" fill="#111111" font-family="system-ui, -apple-system, sans-serif">Offers both languages (hreflang, switcher, translator)</text>
<rect x="440" y="232" width="400" height="18" rx="3" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<rect x="440" y="232" width="102.0" height="18" rx="3" fill="#297a3a"/>
<text x="852" y="246" font-size="12">25.5%</text>
<text x="32" y="286" font-size="12" fill="#111111" font-family="system-ui, -apple-system, sans-serif">Bilingual AND instant text channel</text>
<rect x="440" y="272" width="400" height="18" rx="3" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<rect x="440" y="272" width="14.0" height="18" rx="3" fill="#297a3a"/>
<text x="852" y="286" font-size="12">3.5%</text>
<line x1="32" y1="314" x2="888" y2="314" stroke="#e5e5e5" stroke-width="1"/>
<text x="32" y="336" font-size="10.5" fill="#666666">Passive: 1 GET per homepage, no forms submitted. Chambers: Fort Worth TX + New Jersey. Source: omona.tech</text>
</g></svg>
